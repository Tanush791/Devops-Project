apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexuscore-deployment
  labels:
    app: nexuscore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexuscore
  template:
    metadata:
      labels:
        app: nexuscore
    spec:
      containers:
      - name: nexuscore-app
        image: nexuscore:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: nexuscore-service
  labels:
    app: nexuscore
spec:
  type: NodePort
  selector:
    app: nexuscore
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
