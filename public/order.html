<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NexusCore // Order Invoice</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #030509; --surface: rgba(15, 20, 31, 0.7); --border: rgba(255, 255, 255, 0.08); --primary: #8b5cf6; --accent: #06b6d4; --text: #f8fafc; --muted: #94a3b8; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 40px; }
    .container { max-width: 900px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .header-row { display: flex; justify-content: space-between; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    h1 { font-family: 'Space Grotesk'; color: var(--accent); margin: 0; }
    .btn { background: #fff; color: #000; padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; text-decoration: none; margin-left: 10px; transition: 0.2s; }
    .btn:hover { background: var(--accent); color: #000; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
    .box { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .box h4 { margin: 0 0 10px 0; color: var(--muted); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: var(--muted); text-transform: uppercase; font-size: 0.75rem; }
    td { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .total { font-family: 'Space Grotesk'; font-size: 1.5rem; color: #10b981; font-weight: 700; text-align: right; margin-top: 20px; }
    
    /* PRINT STYLES - Turns dark mode into clean white paper invoice */
    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .container { border: none; padding: 0; box-shadow: none; }
      .btn, .no-print { display: none !important; }
      .box { background: transparent; border: 1px solid #ccc; }
      h1, .total { color: #000 !important; }
      th { color: #666; border-bottom: 2px solid #000; }
      td { border-bottom: 1px solid #eee; }
    }
  </style>
</head>
<body>
  <div class="container" id="content">Loading order manifest...</div>
  <script>
    const formatINR = (v) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(v);
    async function load() {
      const id = new URLSearchParams(window.location.search).get('id');
      try {
        const res = await fetch('/api/orders/' + encodeURIComponent(id));
        if(!res.ok) throw new Error();
        const o = await res.json();
        document.getElementById('content').innerHTML = `
          <div class="header-row">
            <div>
              <h1>TAX INVOICE</h1>
              <div style="color:var(--muted); margin-top:4px;">Order ID: ${o.id}</div>
            </div>
            <div class="no-print">
              <a href="/" class="btn" style="background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--border);">&larr; Back to Console</a>
              <button onclick="window.print()" class="btn">Print / PDF Invoice</button>
            </div>
          </div>
          <div class="grid">
            <div class="box"><h4>Billed To</h4><strong>${o.buyer}</strong><br>${o.email}<br>${o.address}</div>
            <div class="box"><h4>Payment Information</h4>Date: ${o.timestamp}<br>Method: ${o.paymentMethod}<br>Status: <span style="color:#10b981; font-weight:bold;">PAID IN FULL</span></div>
          </div>
          <table>
            <tr><th>Hardware Description</th><th>Qty</th><th style="text-align:right;">Unit Price</th><th style="text-align:right;">Total</th></tr>
            ${o.items.map(i => `<tr><td>${i.name}</td><td>${i.qty}</td><td style="text-align:right;">${formatINR(i.price)}</td><td style="text-align:right;">${formatINR(i.price*i.qty)}</td></tr>`).join('')}
          </table>
          <div class="total">Grand Total: ${formatINR(o.total)}</div>
        `;
      } catch (e) { document.getElementById('content').innerHTML = "<h2 style='color:red;'>Order Not Found.</h2>"; }
    }
    load();
  </script>
</body>
</html>
