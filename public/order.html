<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusCore // Order Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030509;
      --surface: rgba(15, 20, 31, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #8b5cf6;
      --accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 40px 20px; }
    h1, h2, h3, .brand { font-family: 'Space Grotesk', sans-serif; }
    .container { max-width: 900px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 12px; height: 12px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 50%; }
    .back-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-main); padding: 8px 18px; border-radius: 10px; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: 0.2s; }
    .back-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--text-muted); }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; backdrop-filter: blur(12px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .order-head-bar { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 24px; }
    .order-id { font-size: 2rem; color: var(--accent); font-weight: 800; letter-spacing: -0.5px; }
    .order-date { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }
    .order-total-badge { text-align: right; }
    .order-total-badge span { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: block; }
    .total-amount { font-size: 2rem; color: var(--success); font-weight: 800; font-family: 'Space Grotesk', sans-serif; }

    .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
    .info-card { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .info-card h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px; font-weight: 600; }
    .info-value { font-size: 1rem; color: #fff; line-height: 1.5; }
    .pay-tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(139, 92, 246, 0.15); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 6px; padding: 4px 10px; font-size: 0.85rem; font-weight: 600; margin-top: 6px; }

    .items-card { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .items-card h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 14px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    td { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
    tr:last-child td { border-bottom: none; }

    .state-box { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand"><div class="brand-dot"></div> NexusCore</div>
      <a href="/" class="back-btn">&larr; Return to Merchant Console</a>
    </header>

    <div id="content" class="panel">
      <div class="state-box">Loading order manifest...</div>
    </div>
  </div>

  <script>
    const formatINR = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val);

    async function loadOrderDetail() {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('id');

      if (!orderId) {
        document.getElementById('content').innerHTML = '<div class="state-box">No Order ID specified in URL query.</div>';
        return;
      }

      try {
        const res = await fetch('/api/orders/' + encodeURIComponent(orderId));
        if (!res.ok) throw new Error('Order not found');
        const o = await res.json();

        document.getElementById('content').innerHTML = `
          <div class="order-head-bar">
            <div>
              <div class="order-id">${o.id}</div>
              <div class="order-date">Placed: ${o.timestamp || 'Recorded Transaction'}</div>
            </div>
            <div class="order-total-badge">
              <span>Authorized Total</span>
              <div class="total-amount">${formatINR(o.total)}</div>
            </div>
          </div>

          <div class="grid-info">
            <div class="info-card">
              <h4>Customer Details</h4>
              <div class="info-value"><strong>${o.buyer}</strong></div>
              <div class="info-value" style="color:var(--accent); font-size:0.9rem; margin-top:2px;">${o.email || 'No email provided'}</div>
            </div>
            <div class="info-card">
              <h4>Payment Mode</h4>
              <div class="pay-tag">&#9679; ${o.paymentMethod || 'Razorpay / UPI'}</div>
              <div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;">Status: <span style="color:var(--success); font-weight:600;">Verified Paid</span></div>
            </div>
            <div class="info-card" style="grid-column: 1 / -1;">
              <h4>Destination & Shipping Details</h4>
              <div class="info-value">${o.address || 'Standard Ground Datacenter Delivery'}</div>
            </div>
          </div>

          <div class="items-card">
            <h4>Itemized Manifest</h4>
            <table>
              <thead>
                <tr>
                  <th>Hardware Specification</th>
                  <th style="text-align:center;">Quantity</th>
                  <th style="text-align:right;">Unit Price</th>
                  <th style="text-align:right;">Subtotal</th>
                </tr>
              </thead>
              <tbody>
                ${o.items.map(item => `
                  <tr>
                    <td style="color:#fff; font-weight:600;">${item.name}</td>
                    <td style="text-align:center; color:var(--text-muted);">${item.qty}</td>
                    <td style="text-align:right; color:var(--text-muted);">${formatINR(item.price)}</td>
                    <td style="text-align:right; font-family:'Space Grotesk'; font-weight:700; color:var(--accent);">${formatINR(item.price * item.qty)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="state-box">
            <h2 style="color:var(--danger); margin-bottom:8px;">Order Manifest Not Found</h2>
            <p>Could not locate records matching ID: <strong>${orderId}</strong></p>
          </div>
        `;
      }
    }

    loadOrderDetail();
  </script>
</body>
</html>
