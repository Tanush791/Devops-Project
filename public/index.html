<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevStore // Enterprise Cloud Equipment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #0f141f;
      --card-border: #1e2638;
      --card-hover: #26334d;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 80px; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(7, 9, 14, 0.88); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 32px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.25rem; }
    .brand span { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

    .role-toggle {
      display: flex; background: #0b0f19; border: 1px solid var(--card-border);
      border-radius: 10px; padding: 4px; gap: 4px;
    }
    .toggle-btn {
      background: transparent; border: none; color: var(--text-muted);
      padding: 8px 18px; border-radius: 7px; font-weight: 600; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s;
    }
    .toggle-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3); }

    .cart-pill {
      background: #0f141f; border: 1px solid var(--card-border);
      color: var(--text-main); padding: 8px 18px; border-radius: 9999px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .cart-pill:hover { border-color: var(--accent); }
    .cart-badge { background: var(--primary); color: #fff; font-size: 0.75rem; padding: 2px 7px; border-radius: 12px; }

    .container { max-width: 1200px; margin: 32px auto; padding: 0 24px; }
    .hidden { display: none !important; }

    .controls-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .category-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-btn {
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted);
      padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .cat-btn.active, .cat-btn:hover { background: #162032; border-color: var(--accent); color: #fff; }

    .search-input {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 10px 16px; border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none; width: 280px;
    }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 24px; }
    .product-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .product-card:hover { transform: translateY(-4px); border-color: var(--card-hover); }
    .card-thumb { width: 100%; height: 180px; object-fit: cover; background: #162032; }
    .card-body { padding: 18px; display: flex; flex-direction: column; flex: 1; }
    .badge {
      align-self: flex-start; background: rgba(6, 182, 212, 0.1); color: var(--accent);
      border: 1px solid rgba(6, 182, 212, 0.25); font-size: 0.7rem; font-weight: 700;
      padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase;
    }
    .product-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .product-desc { color: var(--text-muted); font-size: 0.85rem; line-height: 1.45; margin-bottom: 18px; flex: 1; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 14px; }
    .product-price { font-size: 1.25rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: #fff; }
    .btn-buy {
      background: var(--primary); color: #fff; border: none; padding: 8px 16px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem;
    }
    .btn-buy:hover { background: var(--primary-hover); }

    .seller-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; }
    @media (max-width: 900px) { .seller-grid { grid-template-columns: 1fr; } }
    .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 24px; }
    .panel h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .form-group input, .form-group textarea, .form-group select {
      background: #07090e; border: 1px solid var(--card-border);
      padding: 10px 12px; border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none;
    }
    .file-input { border: 1px dashed var(--card-border); padding: 12px; cursor: pointer; }
    .btn-submit {
      background: var(--accent); color: #000; border: none; padding: 12px;
      border-radius: 6px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px;
    }

    .manage-list { display: flex; flex-direction: column; gap: 10px; max-height: 480px; overflow-y: auto; }
    .manage-card {
      display: flex; justify-content: space-between; align-items: center;
      background: #07090e; border: 1px solid var(--card-border); padding: 12px 16px; border-radius: 8px;
    }
    .btn-del {
      background: rgba(244, 63, 94, 0.15); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }

    .order-ledger { margin-top: 28px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 24px; }
    .order-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding: 12px 0; }

    /* Cart Drawer */
    .cart-drawer {
      position: fixed; top: 0; right: -420px; width: 400px; height: 100vh;
      background: #0b0f19; border-left: 1px solid var(--card-border);
      padding: 24px; display: flex; flex-direction: column; transition: right 0.25s ease; z-index: 100;
    }
    .cart-drawer.open { right: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 14px; }
    .cart-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 0; }
    .cart-item { display: flex; gap: 12px; background: var(--card-bg); border: 1px solid var(--card-border); padding: 12px; border-radius: 8px; align-items: center; }
    .cart-item-img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: 0.85rem; font-weight: 700; }
    .cart-item-price { font-size: 0.8rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .qty-controls { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .qty-btn { background: #162032; border: 1px solid var(--card-border); color: #fff; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; }
    .qty-display { font-size: 0.8rem; font-weight: 700; min-width: 16px; text-align: center; }
    .cart-total-box { border-top: 1px solid var(--card-border); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
    .total-row { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.15rem; font-family: 'JetBrains Mono', monospace; }
    .checkout-btn { width: 100%; background: var(--success); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
    .toast { background: #162032; border: 1px solid var(--accent); color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand"><span>//</span> CloudStore</div>
    <div class="role-toggle">
      <button class="toggle-btn active" id="buyerToggle" onclick="setRole('buyer')">🛒 Buyer Storefront</button>
      <button class="toggle-btn" id="sellerToggle" onclick="setRole('seller')">📦 Seller Console</button>
    </div>
    <button class="cart-pill" id="cartButton" onclick="toggleCart()">
      🛒 Manifest <span class="cart-badge" id="cartCount">0</span>
    </button>
  </header>

  <main class="container">
    <!-- BUYER VIEW -->
    <section id="buyerView">
      <div class="controls-row">
        <div class="category-pills">
          <button class="cat-btn active" onclick="filterCategory('All', this)">All Hardware</button>
          <button class="cat-btn" onclick="filterCategory('Compute', this)">Compute</button>
          <button class="cat-btn" onclick="filterCategory('Network', this)">Network</button>
          <button class="cat-btn" onclick="filterCategory('Storage', this)">Storage</button>
          <button class="cat-btn" onclick="filterCategory('Security', this)">Security</button>
        </div>
        <input type="text" class="search-input" id="searchBar" placeholder="Search devices or specs..." oninput="handleSearch()">
      </div>
      <div class="product-grid" id="productGrid"></div>
    </section>

    <!-- SELLER VIEW -->
    <section id="sellerView" class="hidden">
      <div class="seller-grid">
        <div class="panel">
          <h2>List New Hardware</h2>
          <form id="productForm" onsubmit="handleCreateProduct(event)">
            <div class="form-group">
              <label>Device Name</label>
              <input type="text" id="devName" placeholder="e.g. Raspberry Pi 5 8GB" required>
            </div>
            <div class="form-group">
              <label>Category</label>
              <select id="devCategory">
                <option value="Compute">Compute</option>
                <option value="Network">Network</option>
                <option value="Storage">Storage</option>
                <option value="Security">Security</option>
              </select>
            </div>
            <div class="form-group">
              <label>Price (₹ INR)</label>
              <input type="number" id="devPrice" placeholder="e.g. 8499" required>
            </div>
            <div class="form-group">
              <label>Upload Local Image File</label>
              <input type="file" id="devFile" class="file-input" accept="image/*">
            </div>
            <div class="form-group">
              <label>Or Web Image URL (Optional)</label>
              <input type="url" id="devImage" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="form-group">
              <label>Technical Specifications</label>
              <textarea id="devDesc" rows="3" placeholder="Core architecture, memory specs, interfaces..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Publish to Live Storefront</button>
          </form>
        </div>

        <div class="panel">
          <h2>Active Store Inventory</h2>
          <div class="manage-list" id="sellerInventory"></div>
        </div>
      </div>

      <div class="order-ledger">
        <h2>Live Orders Manifest</h2>
        <div id="ordersList"><p style="color: var(--text-muted); font-size: 0.9rem;">No transactions recorded yet.</p></div>
      </div>
    </section>
  </main>

  <!-- Cart Slideover Drawer -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="drawer-header">
      <h3>Active Order Manifest</h3>
      <button onclick="toggleCart()" style="background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;">&times;</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total-box">
      <div class="total-row">
        <span>Total (INR):</span>
        <span id="cartTotal">₹0</span>
      </div>
      <button class="checkout-btn" onclick="handleCheckout()">Complete Purchase</button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    let products = [];
    let cart = [];
    let activeCategory = 'All';
    let searchQuery = '';

    const formatINR = function(val) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency', currency: 'INR', maximumFractionDigits: 0
      }).format(val);
    };

    function setRole(role) {
      const buyerToggle = document.getElementById('buyerToggle');
      const sellerToggle = document.getElementById('sellerToggle');
      const buyerView = document.getElementById('buyerView');
      const sellerView = document.getElementById('sellerView');
      const cartButton = document.getElementById('cartButton');

      if (role === 'buyer') {
        buyerToggle.classList.add('active');
        sellerToggle.classList.remove('active');
        buyerView.classList.remove('hidden');
        sellerView.classList.add('hidden');
        cartButton.classList.remove('hidden');
      } else {
        sellerToggle.classList.add('active');
        buyerToggle.classList.remove('active');
        sellerView.classList.remove('hidden');
        buyerView.classList.add('hidden');
        cartButton.classList.add('hidden');
        loadOrders();
        renderSellerList();
      }
    }

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        products = await res.json();
        renderBuyerCatalog();
        renderSellerList();
      } catch (err) {
        showToast('Error loading catalog');
      }
    }

    async function loadOrders() {
      try {
        const res = await fetch('/api/orders');
        const orders = await res.json();
        const list = document.getElementById('ordersList');
        if (orders.length === 0) {
          list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No transactions recorded yet.</p>';
          return;
        }

        list.innerHTML = orders.map(function(o) {
          return '<div class="order-row">' +
            '<div>' +
              '<div style="font-weight:700; font-family:JetBrains Mono;">' + o.id + ' &bull; ' + o.buyer + '</div>' +
              '<div style="color:var(--text-muted); font-size:0.8rem;">' + o.timestamp + ' &bull; ' + o.items.map(function(i){return i.name + ' (x' + i.qty + ')';}).join(', ') + '</div>' +
            '</div>' +
            '<div style="font-weight:800; font-family:JetBrains Mono; color:var(--success);">' + formatINR(o.total) + '</div>' +
          '</div>';
        }).join('');
      } catch(e) {
        console.error(e);
      }
    }

    function renderBuyerCatalog() {
      const grid = document.getElementById('productGrid');
      const filtered = products.filter(function(p) {
        const matchesCat = activeCategory === 'All' || p.category === activeCategory;
        const matchesQuery = p.name.toLowerCase().includes(searchQuery) || p.desc.toLowerCase().includes(searchQuery);
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No matching equipment found.</p>';
        return;
      }

      grid.innerHTML = filtered.map(function(p) {
        return '<article class="product-card">' +
          '<img class="card-thumb" src="' + p.image + '" alt="' + p.name + '" onerror="this.src=\'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&auto=format&fit=crop&q=80\'">' +
          '<div class="card-body">' +
            '<span class="badge">' + p.category + '</span>' +
            '<h3 class="product-title">' + p.name + '</h3>' +
            '<p class="product-desc">' + p.desc + '</p>' +
            '<div class="card-footer">' +
              '<span class="product-price">' + formatINR(p.price) + '</span>' +
              '<button class="btn-buy" onclick="addToCart(' + p.id + ')">Add to Manifest</button>' +
            '</div>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    function renderSellerList() {
      const list = document.getElementById('sellerInventory');
      if (!list) return;
      if (products.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">No active inventory.</p>';
        return;
      }

      list.innerHTML = products.map(function(p) {
        return '<div class="manage-card">' +
          '<div>' +
            '<div style="font-weight:700; font-size:0.9rem;">' + p.name + '</div>' +
            '<div style="color:var(--text-muted); font-size:0.75rem; font-family:JetBrains Mono;">' + p.category + ' &bull; ' + formatINR(p.price) + '</div>' +
          '</div>' +
          '<button class="btn-del" onclick="deleteProduct(' + p.id + ')">Unlist Device</button>' +
        '</div>';
      }).join('');
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderBuyerCatalog();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchBar').value.toLowerCase().trim();
      renderBuyerCatalog();
    }

    async function handleCreateProduct(e) {
      e.preventDefault();
      
      const formData = new FormData();
      formData.append('name', document.getElementById('devName').value);
      formData.append('category', document.getElementById('devCategory').value);
      formData.append('price', document.getElementById('devPrice').value);
      formData.append('imageUrl', document.getElementById('devImage').value);
      formData.append('desc', document.getElementById('devDesc').value);

      const fileInput = document.getElementById('devFile');
      if (fileInput.files.length > 0) {
        formData.append('imageFile', fileInput.files[0]);
      }

      const res = await fetch('/api/products', {
        method: 'POST',
        body: formData
      });

      if (res.ok) {
        showToast('Hardware listed with custom image!');
        document.getElementById('productForm').reset();
        await loadProducts();
      } else {
        showToast('Failed to list device');
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Unlist this hardware component?')) return;
      const res = await fetch('/api/products/' + id, { method: 'DELETE' });
      if (res.ok) {
        showToast('Component unlisted');
        cart = cart.filter(function(i) { return i.id !== id; });
        updateCart();
        await loadProducts();
      }
    }

    function addToCart(id) {
      const existing = cart.find(function(i) { return i.id === id; });
      if (existing) {
        existing.qty += 1;
      } else {
        const item = products.find(function(p) { return p.id === id; });
        if (item) cart.push({ id: item.id, name: item.name, price: item.price, image: item.image, qty: 1 });
      }
      updateCart();
      showToast('Manifest updated');
    }

    function changeQty(id, delta) {
      const item = cart.find(function(i) { return i.id === id; });
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(function(i) { return i.id !== id; });
      }
      updateCart();
    }

    function updateCart() {
      const totalCount = cart.reduce(function(sum, i) { return sum + i.qty; }, 0);
      document.getElementById('cartCount').innerText = totalCount;

      const list = document.getElementById('cartItems');
      if (cart.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:30px;">Cart manifest is empty.</p>';
        document.getElementById('cartTotal').innerText = formatINR(0);
        return;
      }

      list.innerHTML = cart.map(function(item) {
        return '<div class="cart-item">' +
          '<img class="cart-item-img" src="' + item.image + '" alt="' + item.name + '">' +
          '<div class="cart-item-info">' +
            '<div class="cart-item-name">' + item.name + '</div>' +
            '<div class="cart-item-price">' + formatINR(item.price) + ' &times; ' + item.qty + '</div>' +
            '<div class="qty-controls">' +
              '<button class="qty-btn" onclick="changeQty(' + item.id + ', -1)">-</button>' +
              '<span class="qty-display">' + item.qty + '</span>' +
              '<button class="qty-btn" onclick="changeQty(' + item.id + ', 1)">+</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      const total = cart.reduce(function(sum, i) { return sum + (i.price * i.qty); }, 0);
      document.getElementById('cartTotal').innerText = formatINR(total);
    }

    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
    }

    async function handleCheckout() {
      if (cart.length === 0) return;
      const total = cart.reduce(function(sum, i) { return sum + (i.price * i.qty); }, 0);
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: cart, buyerName: "Verified Client", total: total })
      });
      const data = await res.json();
      showToast(data.message);
      cart = [];
      updateCart();
      toggleCart();
    }

    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 2500);
    }

    loadProducts();
  </script>
</body>
</html>
