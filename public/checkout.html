<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusCore // Secure Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030509;
      --surface: rgba(15, 20, 31, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #8b5cf6;
      --accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 40px 20px; }
    h1, h2, h3, .brand { font-family: 'Space Grotesk', sans-serif; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 12px; height: 12px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 50%; }
    .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { color: #fff; }

    .checkout-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; backdrop-filter: blur(12px); }
    .panel h2 { font-size: 1.3rem; margin-bottom: 20px; color: #fff; }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .form-group input, .form-group textarea, .form-group select { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }

    .order-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    .order-item:last-child { border-bottom: none; }
    .total-box { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 1.4rem; font-family: 'Space Grotesk'; font-weight: 700; color: var(--accent); }

    .pay-btn { width: 100%; background: #fff; color: #000; border: none; padding: 16px; border-radius: 12px; font-family: 'Space Grotesk'; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 24px; transition: 0.2s; }
    .pay-btn:hover { background: var(--accent); color: #000; }

    .order-success { display: none; text-align: center; padding: 40px; }
    .order-success h2 { font-size: 2rem; color: var(--success); margin-bottom: 12px; }
    .order-success p { color: var(--text-muted); margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand"><div class="brand-dot"></div> NexusCore</div>
      <a href="/" class="back-link">&larr; Return to Storefront</a>
    </header>

    <div id="checkoutContent" class="checkout-grid">
      <div class="panel">
        <h2>Customer & Delivery Details</h2>
        <form id="checkoutForm" onsubmit="processPayment(event)">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="buyerName" placeholder="e.g. Rahul Sharma" required>
          </div>
          <div class="form-group">
            <label>Work Email</label>
            <input type="email" id="buyerEmail" placeholder="rahul@company.io" required>
          </div>
          <div class="form-group">
            <label>Shipping / Datacenter Address</label>
            <textarea id="buyerAddress" rows="3" placeholder="Street, Building / Rack, City, PIN" required></textarea>
          </div>
          <div class="form-group">
            <label>Payment Method</label>
            <select id="paymentMethod">
              <option value="Razorpay / UPI">Razorpay / UPI Instant</option>
              <option value="Corporate Credit Card">Corporate Credit Card (Visa / Mastercard)</option>
              <option value="Net Banking (HDFC / ICICI / SBI)">Net Banking</option>
              <option value="Purchase Order (Net-30 Invoice)">Purchase Order (Net-30)</option>
            </select>
          </div>
          <button type="submit" id="submitOrderBtn" class="pay-btn">Confirm & Authorize Order</button>
        </form>
      </div>

      <div class="panel">
        <h2>Order Summary</h2>
        <div id="checkoutItemList"></div>
        <div class="total-box">
          <span>Total Payable</span>
          <span id="checkoutTotal">₹0</span>
        </div>
      </div>
    </div>

    <div id="orderSuccess" class="panel order-success">
      <h2>Order Authorized!</h2>
      <p id="receiptMsg">Your hardware provisioning order has been recorded into the merchant ledger.</p>
      <a href="/" class="pay-btn" style="display:inline-block; text-decoration:none; padding:12px 30px; width:auto;">Back to Catalog</a>
    </div>
  </div>

  <script>
    const cart = JSON.parse(localStorage.getItem('nexus_cart') || '[]');
    const formatINR = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val);

    function renderSummary() {
      const list = document.getElementById('checkoutItemList');
      const totalEl = document.getElementById('checkoutTotal');

      if (cart.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted);">No items in cart.</p>';
        return;
      }

      list.innerHTML = cart.map(i => `
        <div class="order-item">
          <div>
            <div style="font-weight:600;">${i.name}</div>
            <div style="font-size:0.8rem; color:var(--text-muted);">Qty: ${i.qty} &bull; ${formatINR(i.price)} each</div>
          </div>
          <div style="font-weight:600;">${formatINR(i.price * i.qty)}</div>
        </div>
      `).join('');

      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      totalEl.innerText = formatINR(total);
    }

    async function processPayment(e) {
      e.preventDefault();
      const buyerName = document.getElementById('buyerName').value;
      const buyerEmail = document.getElementById('buyerEmail').value;
      const buyerAddress = document.getElementById('buyerAddress').value;
      const paymentMethod = document.getElementById('paymentMethod').value;
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: cart, buyerName, buyerEmail, buyerAddress, paymentMethod, total })
      });

      if (res.ok) {
        const data = await res.json();
        localStorage.removeItem('nexus_cart');
        document.getElementById('checkoutContent').style.display = 'none';
        document.getElementById('orderSuccess').style.display = 'block';
        document.getElementById('receiptMsg').innerText = `Order ID: ${data.orderId} has been confirmed. Deliverable to: ${buyerName} (${buyerAddress}).`;
      }
    }

    renderSummary();
  </script>
</body>
</html>
