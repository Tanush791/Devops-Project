<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NexusCore // Secure Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #030509; --surface: rgba(15, 20, 31, 0.7); --border: rgba(255, 255, 255, 0.08); --primary: #8b5cf6; --accent: #06b6d4; --text-main: #f8fafc; --text-muted: #94a3b8; --success: #10b981; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 40px 20px; }
    h1, h2, h3, .brand { font-family: 'Space Grotesk', sans-serif; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 12px; height: 12px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 50%; }
    .back-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }

    .checkout-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; backdrop-filter: blur(12px); }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
    .form-group input, .form-group textarea, .form-group select { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; }
    
    .order-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    .total-box { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 1.4rem; font-family: 'Space Grotesk'; font-weight: 700; color: var(--accent); }
    .pay-btn { width: 100%; background: #fff; color: #000; border: none; padding: 16px; border-radius: 12px; font-family: 'Space Grotesk'; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 24px; transition: 0.2s; }
    
    /* PROCESSING OVERLAY */
    #processingOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; flex-direction:column; backdrop-filter:blur(5px); }
    .spinner { width:50px; height:50px; border:4px solid rgba(255,255,255,0.1); border-top-color:var(--accent); border-radius:50%; animation: spin 1s infinite linear; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- LOADING OVERLAY -->
  <div id="processingOverlay">
    <div class="spinner"></div>
    <h2 style="color:#fff; margin-top:24px; font-family:'Space Grotesk';">Authenticating Payment Gateway...</h2>
    <p style="color:var(--text-muted); margin-top:10px;">Please do not refresh the page.</p>
  </div>

  <div class="container">
    <header>
      <div class="brand"><div class="brand-dot"></div> NexusCore</div>
      <a href="/" class="back-link">&larr; Return to Storefront</a>
    </header>

    <div id="checkoutContent" class="checkout-grid">
      <div class="panel">
        <h2 style="margin-bottom:20px;">Customer & Delivery Details</h2>
        <form id="checkoutForm" onsubmit="processPayment(event)">
          <div class="form-group"><label>Full Name</label><input type="text" id="buyerName" required></div>
          <div class="form-group"><label>Work Email</label><input type="email" id="buyerEmail" required></div>
          <div class="form-group"><label>Shipping Address</label><textarea id="buyerAddress" rows="3" required></textarea></div>
          <div class="form-group">
            <label>Payment Method</label>
            <select id="paymentMethod"><option>Razorpay / UPI</option><option>Corporate Credit Card</option></select>
          </div>
          <button type="submit" id="submitOrderBtn" class="pay-btn">Confirm & Authorize Order</button>
        </form>
      </div>

      <div class="panel">
        <h2 style="margin-bottom:20px;">Order Summary</h2>
        <div id="checkoutItemList"></div>
        
        <!-- PROMO CODE FIELD -->
        <div class="form-group" style="flex-direction:row; gap:10px; margin-top:20px;">
          <input type="text" id="promoInput" placeholder="Promo Code (e.g. DEVOPS10)" style="flex:1;">
          <button type="button" onclick="applyPromo()" style="background:rgba(255,255,255,0.1); color:#fff; border:1px solid var(--border); padding:0 20px; border-radius:10px; cursor:pointer;">Apply</button>
        </div>
        <div id="promoMsg" style="color:var(--success); font-size:0.85rem; font-weight:600; display:none;">10% Discount Applied!</div>

        <div class="total-box"><span>Total Payable</span><span id="checkoutTotal">₹0</span></div>
      </div>
    </div>

    <div id="orderSuccess" class="panel" style="display:none; text-align:center;">
      <h2 style="color:var(--success); font-size:2rem; margin-bottom:15px;">Order Authorized!</h2>
      <p id="receiptMsg" style="color:var(--text-muted); margin-bottom:25px;">Your provisioning order is recorded.</p>
      <a href="/" class="pay-btn" style="display:inline-block; text-decoration:none; padding:12px 30px; width:auto;">Back to Catalog</a>
    </div>
  </div>

  <script>
    const cart = JSON.parse(localStorage.getItem('nexus_cart') || '[]');
    const formatINR = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val);
    let activePromo = '';

    function renderSummary() {
      if(cart.length === 0) { document.getElementById('checkoutItemList').innerHTML = '<p>No items.</p>'; return; }
      document.getElementById('checkoutItemList').innerHTML = cart.map(i => `<div class="order-item"><div><div style="font-weight:600;">${i.name}</div><div style="font-size:0.8rem; color:var(--text-muted);">Qty: ${i.qty} &bull; ${formatINR(i.price)}</div></div><div style="font-weight:600;">${formatINR(i.price * i.qty)}</div></div>`).join('');
      
      let subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      if(activePromo === 'DEVOPS10') subtotal = subtotal * 0.90; // Apply 10% on frontend UI
      document.getElementById('checkoutTotal').innerText = formatINR(subtotal);
    }

    function applyPromo() {
      const code = document.getElementById('promoInput').value.trim().toUpperCase();
      if(code === 'DEVOPS10') { activePromo = code; document.getElementById('promoMsg').style.display = 'block'; renderSummary(); }
      else { alert('Invalid Promo Code'); document.getElementById('promoInput').value = ''; }
    }

    function processPayment(e) {
      e.preventDefault();
      
      // Show Mock Payment Gateway Overlay
      document.getElementById('processingOverlay').style.display = 'flex';
      
      // Simulate 2 second API/Bank negotiation
      setTimeout(async () => {
        const body = {
          items: cart, buyerName: document.getElementById('buyerName').value,
          buyerEmail: document.getElementById('buyerEmail').value, buyerAddress: document.getElementById('buyerAddress').value,
          paymentMethod: document.getElementById('paymentMethod').value, promoCode: activePromo
        };

        const res = await fetch('/api/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (res.ok) {
          const data = await res.json();
          localStorage.removeItem('nexus_cart');
          document.getElementById('processingOverlay').style.display = 'none';
          document.getElementById('checkoutContent').style.display = 'none';
          document.getElementById('orderSuccess').style.display = 'block';
          document.getElementById('receiptMsg').innerText = `Order ID: ${data.orderId} has been confirmed.`;
        }
      }, 2000);
    }

    renderSummary();
  </script>
</body>
</html>
